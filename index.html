<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#1216B0">
  <title>Consertaí — A confiança que a sua casa precisa | MVP USP</title>
  
  <!-- Fontes Google -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Leaflet para o Mapa Real Interativo -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <!-- Estilos da Aplicação -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Barra Superior de Controle e Demonstração -->
  <div class="test-banner">
    <div class="brand-tag-group">
      <span class="tag-usp">USP SI</span>
      <span>Consertaí MVP</span>
    </div>
    <div class="controls-group">
      <!-- Alternador de Visão de Dispositivo -->
      <div class="btn-group" title="Alternar formato de tela para apresentação">
        <button class="ctrl-btn active" id="btn-view-mobile" onclick="toggleScreenMode('mobile')">📱 Celular</button>
        <button class="ctrl-btn" id="btn-view-desktop" onclick="toggleScreenMode('desktop')">💻 PC / Web</button>
      </div>
      <!-- Alternador de Papel -->
      <div class="btn-group">
        <button class="ctrl-btn" id="btn-role-morador" onclick="switchRole('morador')">Morador</button>
        <button class="ctrl-btn" id="btn-role-prestador" onclick="switchRole('prestador')">Prestador</button>
      </div>
    </div>
  </div>

  <div class="app-wrapper">
    <div id="app"></div>
  </div>

  <div id="toast"></div>
  <div id="modal-root"></div>

  <!-- Scripts Modulares da Aplicação -->
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
